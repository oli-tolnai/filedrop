services:
  filedrop:
    build:
      context: .
    image: filedrop:local
    container_name: filedrop
    restart: unless-stopped
    ports:
      - "${FILEDROP_BIND_ADDRESS:-192.168.0.34}:${FILEDROP_PORT:-8090}:8080"
      # Tailscale Serve helyi célpontja; ez a port csak a Dell gépen érhető el.
      - "127.0.0.1:${FILEDROP_TAILSCALE_PORT:-8091}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FileDrop__StoragePath: /app/data/files
      FileDrop__TemporaryPath: /app/data/incoming
      FileDrop__DatabasePath: /app/data/filedrop.db
      FileDrop__ReservedFreeSpaceBytes: "107374182400"
      FileDrop__SetupToken: "${FILEDROP_SETUP_TOKEN:?A FILEDROP_SETUP_TOKEN nincs beállítva}"
      FileDrop__PublicBaseUrl: "${FILEDROP_PUBLIC_BASE_URL:-}"
    volumes:
      - /srv/filedrop/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # Külön Tailscale-eszköz a FileDrophoz. A network_mode miatt ez a konténer
  # csak a FileDrop konténer hálózati névterét használja, nem a Dell hostét.
  filedrop-tailscale:
    image: tailscale/tailscale:latest
    container_name: filedrop-tailscale
    network_mode: service:filedrop
    depends_on:
      filedrop:
        condition: service_started
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${FILEDROP_TS_AUTHKEY:?A FILEDROP_TS_AUTHKEY nincs beállítva}"
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: filedrop-tailscale
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /serve-config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /srv/filedrop/tailscale-state:/var/lib/tailscale
      - ./tailscale-config:/serve-config:ro

  # Szigorú nyilvános kapu: csak a meghívóoldalt, annak statikus fájljait és
  # a vendég-feltöltési API-t engedi tovább a FileDrop felé.
  filedrop-public-gateway:
    image: nginxinc/nginx-unprivileged:1.31.6-alpine3.24
    container_name: filedrop-public-gateway
    profiles: ["public"]
    depends_on:
      filedrop:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FILEDROP_PUBLIC_GATEWAY_PORT:-8092}:8080"
    volumes:
      - ./public-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public-gateway/proxy_params:/etc/nginx/proxy_params:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev,uid=101,gid=101,mode=700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/public-health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Külön, távolról kezelt Cloudflare Tunnel. A token kizárólag a Dell
  # root tulajdonú .env fájljában lehet, Gitbe nem kerülhet.
  filedrop-public-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: filedrop-public-cloudflared
    profiles: ["public"]
    depends_on:
      filedrop-public-gateway:
        condition: service_healthy
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Üresen maradhat, amíg csak a helyi kaput teszteljük. A tunnel
      # konténert kizárólag valódi, titkos tokennel szabad elindítani.
      TUNNEL_TOKEN: "${FILEDROP_CF_TUNNEL_TOKEN:-}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
