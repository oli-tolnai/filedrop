services:
  filedrop:
    build:
      context: .
    image: filedrop:local
    container_name: filedrop
    restart: unless-stopped
    ports:
      - "${FILEDROP_BIND_ADDRESS:-192.168.0.34}:${FILEDROP_PORT:-8090}:8080"
      # Tailscale Serve helyi célpontja; ez a port csak a Dell gépen érhető el.
      - "127.0.0.1:${FILEDROP_TAILSCALE_PORT:-8091}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FileDrop__StoragePath: /app/data/files
      FileDrop__TemporaryPath: /app/data/incoming
      FileDrop__DatabasePath: /app/data/filedrop.db
      FileDrop__ReservedFreeSpaceBytes: "107374182400"
      FileDrop__SetupToken: "${FILEDROP_SETUP_TOKEN:?A FILEDROP_SETUP_TOKEN nincs beállítva}"
    volumes:
      - /srv/filedrop/data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # Külön Tailscale-eszköz a FileDrophoz. A network_mode miatt ez a konténer
  # csak a FileDrop konténer hálózati névterét használja, nem a Dell hostét.
  filedrop-tailscale:
    image: tailscale/tailscale:latest
    container_name: filedrop-tailscale
    network_mode: service:filedrop
    depends_on:
      filedrop:
        condition: service_started
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${FILEDROP_TS_AUTHKEY:?A FILEDROP_TS_AUTHKEY nincs beállítva}"
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: filedrop-tailscale
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /serve-config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - /srv/filedrop/tailscale-state:/var/lib/tailscale
      - ./tailscale-config:/serve-config:ro
