worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    # A valódi látogatói IP-t a kizárólag cloudflared által elérhető átjáró
    # CF-Connecting-IP fejléce adja. Az üres kulcs (helyi ellenőrzés) nem limitált.
    map $http_cf_connecting_ip $public_client_key {
        ""      $binary_remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $public_client_key zone=public_invite_ip:10m rate=30r/m;

    server {
        listen 8080;
        client_max_body_size 100m;
        limit_req_status 429;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        # Egy érvényes meghívóoldal. A kódban szándékosan nincs 0, 1, I vagy O.
        location ~* "^/u/[A-HJ-NP-Z2-9]{4}-?[A-HJ-NP-Z2-9]{4}/?$" {
            limit_req zone=public_invite_ip burst=10 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://filedrop:8080;
            include /etc/nginx/proxy_params;
        }

        # Az Angular meghívóoldal futtatásához szükséges, hash-elt statikus fájlok.
        location ~ "^/(?:main|chunk)-[A-Z0-9]+\.js$" {
            limit_except GET { deny all; }
            proxy_pass http://filedrop:8080;
            include /etc/nginx/proxy_params;
        }

        location ~ "^/styles-[A-Z0-9]+\.css$" {
            limit_except GET { deny all; }
            proxy_pass http://filedrop:8080;
            include /etc/nginx/proxy_params;
        }

        # Meghívó megnyitása; kizárólag GET.
        location ~* "^/api/public/invitations/[A-HJ-NP-Z2-9]{8}/?$" {
            limit_req zone=public_invite_ip burst=10 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://filedrop:8080;
            include /etc/nginx/proxy_params;
        }

        # Fájlok beküldése; kizárólag POST, pufferelés nélkül továbbítva.
        location ~* "^/api/public/invitations/[A-HJ-NP-Z2-9]{8}/uploads/?$" {
            limit_req zone=public_invite_ip burst=5 nodelay;
            limit_except POST { deny all; }
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_pass http://filedrop:8080;
            include /etc/nginx/proxy_params;
        }

        # A küldő kizárólag a saját, szerveroldalon ellenőrzött fájlazonosítóját törölheti.
        location ~* "^/api/public/invitations/[A-HJ-NP-Z2-9]{8}/uploads/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/?$" {
            limit_req zone=public_invite_ip burst=5 nodelay;
            limit_except DELETE { deny all; }
            proxy_pass http://filedrop:8080;
            include /etc/nginx/proxy_params;
        }

        # Cloudflare és a helyi ellenőrzés ezt használja; alkalmazásadatot nem ad ki.
        location = /public-health {
            access_log off;
            # A cloudflared minden publikus kéréshez hozzáadja ezt a fejlécet.
            # Az állapotjelző kizárólag helyi Docker/host ellenőrzésre szolgál.
            if ($http_cf_connecting_ip != "") { return 404; }
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Minden más – kezdőlap, belépés, admin, letöltések – kívül marad.
        location / {
            return 404;
        }
    }
}
